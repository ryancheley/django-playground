{% extends "base.html" %}

{% block content %}
<h1 class="sm:flex-auto text-base font-semibold leading-6 text-gray-900">{{ object.title }}</h1>

<dl>
  <dt>Body</dt>
  <dd>{{ object.body | safe }}</dd>

  <dt>Published</dt>
  <dd>{{ object.published_date }}</dd>

  <dt>Categories</dt>
  <dd>{{ object.categories.all|join:", "|default:"—" }}</dd>
</dl>
{% endblock %}
