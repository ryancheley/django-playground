{% extends "base.html" %}

{% block content %}
<h1 class="sm:flex-auto text-base font-semibold leading-6 text-gray-900">{{ title }}</h1>
<form method="post" action="{% url 'get-data' %}">
  {% csrf_token %}
  <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mt-6">Run sync</button>
</form>
<section>
  <ul class="flex">
    <li class="mr-6 mt-6">
      <a class="text-blue-500 hover:text-blue-800" href="{% url 'conference-list'%}">Conferences</a>
    </li>
    <li class="mr-6 mt-6">
      <a class="text-blue-500 hover:text-blue-800" href="{% url 'division-list'%}">Divisions</a>
    </li>
    <li class="mr-6 mt-6">
      <a class="text-blue-500 hover:text-blue-800" href="{% url 'season-list'%}">Seasons</a>
    </li>
    <li class="mr-6 mt-6">
      <a class="text-blue-500 hover:text-blue-800" href="{% url 'team-list'%}">Teams</a>
    </li>
    <li class="mr-6 mt-6">
      <a class="text-blue-500 hover:text-blue-800" href="{% url 'teamseason-list'%}">Team Seasons</a>
    </li>
  </ul>
</section>
{% endblock %}
