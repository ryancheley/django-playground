{% extends "base.html" %}

{% block content %}
<h1> {{ title }} </h1>

{% with action=view.action|default:"Create"%}
<form method="post" action="">
  {% csrf_token %}
  {{ form }}
  <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mt-6">{{ action }} Person</button>
  <br/>

</form>
{% endwith %}

{% endblock %}
