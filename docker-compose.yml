services:
  db:
    image: postgres:17-alpine
    container_name: dj-playground-db
    environment:
      POSTGRES_DB: dj-playground
      POSTGRES_USER: dj-playground
      POSTGRES_PASSWORD: dj-playground_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dj-playground"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dj-playground-network

  web:
    expose:
      - "8000"
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dj-playground-web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 300"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - dj-playground-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dj-playground-worker
    command: >
      sh -c "python manage.py db_worker"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dj-playground-network

volumes:
  postgres_data:

networks:
  dj-playground-network:
    driver: bridge
