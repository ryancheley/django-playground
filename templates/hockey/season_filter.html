{% extends "base.html" %}

{% block content %}
<h1>{{title}}</h1>
<form method="post" action="">
  {% csrf_token %}
  {{ form }}
  <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mt-6">Filter Seasons</button>
</form>
<ul>
    {% for season in seasons %}
        <li>{{season}}</li>
    {% endfor %}
</ul>
{% endblock %}
